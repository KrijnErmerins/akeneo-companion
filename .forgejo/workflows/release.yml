name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: homelab/act-runner:node22-zip
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm version --no-git-tag-version --allow-same-version "$VERSION"

      - name: Commit version bump to main
        run: |
          git config user.name "forgejo-actions"
          git config user.email "forgejo-actions@noreply.git.krijn.dev"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: bump package.json version to ${GITHUB_REF_NAME#v}"
            git push origin HEAD:main
          fi

      - run: npm run build
        env:
          VITE_AKENEO_BASE_URL: ${{ secrets.VITE_AKENEO_BASE_URL }}
          VITE_AKENEO_CLIENT_ID: ${{ secrets.VITE_AKENEO_CLIENT_ID }}
          VITE_AKENEO_CLIENT_SECRET: ${{ secrets.VITE_AKENEO_CLIENT_SECRET }}
          VITE_AKENEO_USERNAME: ${{ secrets.VITE_AKENEO_USERNAME }}
          VITE_AKENEO_PASSWORD: ${{ secrets.VITE_AKENEO_PASSWORD }}

      - name: Zip extension
        run: cd dist && zip -r ../akeneo-companion.zip . && cd ..

      - name: Create Forgejo release and upload assets
        env:
          FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          API="https://git.krijn.dev/api/v1/repos/krijn/akeneo-companion"

          RELEASE_ID=$(curl -sf -X POST "$API/releases" \
            -H "Authorization: token ${FORGEJO_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"tag_name\": \"${TAG}\", \"name\": \"${TAG}\", \"generate_release_notes\": true}" \
            | grep -o '"id":[0-9]*' | head -1 | grep -o '[0-9]*')

          curl -sf -X POST "$API/releases/${RELEASE_ID}/assets?name=akeneo-companion.zip" \
            -H "Authorization: token ${FORGEJO_TOKEN}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@akeneo-companion.zip"
