name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci

      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm version --no-git-tag-version --allow-same-version "$VERSION"

      - name: Commit version bump to main
        run: |
          git config user.name "forgejo-actions"
          git config user.email "forgejo-actions@noreply.git.krijn.dev"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: bump package.json version to ${GITHUB_REF_NAME#v}"
            git push origin HEAD:main
          fi

      - run: npm run build
        env:
          VITE_AKENEO_BASE_URL: ${{ secrets.VITE_AKENEO_BASE_URL }}
          VITE_AKENEO_CLIENT_ID: ${{ secrets.VITE_AKENEO_CLIENT_ID }}
          VITE_AKENEO_CLIENT_SECRET: ${{ secrets.VITE_AKENEO_CLIENT_SECRET }}
          VITE_AKENEO_USERNAME: ${{ secrets.VITE_AKENEO_USERNAME }}
          VITE_AKENEO_PASSWORD: ${{ secrets.VITE_AKENEO_PASSWORD }}

      - name: Install zip
        run: command -v zip &>/dev/null || (apt-get update && apt-get install -y zip)

      - name: Zip extension
        run: cd dist && zip -r ../akeneo-companion.zip . && cd ..

      - name: Install Google Chrome
        run: |
          if command -v google-chrome-stable &>/dev/null || command -v google-chrome &>/dev/null; then
            echo "Chrome already installed: $(google-chrome --version 2>/dev/null || google-chrome-stable --version)"
          else
            wget -q -O /tmp/google-chrome-signing.pub https://dl.google.com/linux/linux_signing_key.pub
            gpg --batch --no-tty --dearmor -o /usr/share/keyrings/google-chrome.gpg /tmp/google-chrome-signing.pub
            echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome.gpg] http://dl.google.com/linux/chrome/deb/ stable main" | tee /etc/apt/sources.list.d/google-chrome.list
            apt-get update
            apt-get install -y google-chrome-stable
          fi

      - name: Write PEM key
        run: echo "${{ secrets.CRX_KEY_PEM }}" > key.pem

      - name: Pack extension as CRX
        run: |
          google-chrome --pack-extension=dist --pack-extension-key=key.pem
          mv dist.crx akeneo-companion.crx
          rm key.pem

      - name: Generate update.xml
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          TAG="${GITHUB_REF_NAME}"
          cat > update.xml <<EOF
          <?xml version='1.0' encoding='UTF-8'?>
          <gupdate xmlns='http://www.google.com/update2/response' protocol='2.0'>
            <app appid='maedoobjjnagcbgdkclfnkjdbjkkmnap'>
              <updatecheck codebase='https://git.krijn.dev/krijn/akeneo-companion/releases/download/${TAG}/akeneo-companion.crx' version='${VERSION}' />
            </app>
          </gupdate>
          EOF

      - name: Commit update.xml to main
        run: |
          git add update.xml
          if ! git diff --cached --quiet; then
            git commit -m "chore: update.xml for ${GITHUB_REF_NAME}"
            git push origin HEAD:main
          fi

      - uses: https://code.forgejo.org/actions/forgejo-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release-dir: .
          files: |
            akeneo-companion.zip
            akeneo-companion.crx
            update.xml
