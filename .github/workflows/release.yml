name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci

      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm version --no-git-tag-version --allow-same-version "$VERSION"

      - run: npm run build
        env:
          VITE_AKENEO_BASE_URL: ${{ secrets.VITE_AKENEO_BASE_URL }}
          VITE_AKENEO_CLIENT_ID: ${{ secrets.VITE_AKENEO_CLIENT_ID }}
          VITE_AKENEO_CLIENT_SECRET: ${{ secrets.VITE_AKENEO_CLIENT_SECRET }}
          VITE_AKENEO_USERNAME: ${{ secrets.VITE_AKENEO_USERNAME }}
          VITE_AKENEO_PASSWORD: ${{ secrets.VITE_AKENEO_PASSWORD }}

      - name: Zip extension
        run: cd dist && zip -r ../akeneo-companion.zip . && cd ..

      - uses: softprops/action-gh-release@v2
        with:
          files: akeneo-companion.zip
          generate_release_notes: true
          body: |
            Repo is verhuisd naar Forgejo — nieuwe releases staan voortaan op https://git.krijn.dev/krijn/akeneo-companion/releases/latest
